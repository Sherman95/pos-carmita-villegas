<nav class="bottom-nav elevation-z6">
  @for (item of navItems; track item.label) {
    @if (item.path) {
      <a matRipple class="nav-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
        <div class="icon-container"><mat-icon>{{ item.icon }}</mat-icon></div>
        <span class="label">{{ item.label }}</span>
      </a>
    } @else {
      <button type="button" matRipple class="nav-item" (click)="handleItemClick(item)">
        <div class="icon-container"><mat-icon>{{ item.icon }}</mat-icon></div>
        <span class="label">{{ item.label }}</span>
      </button>
    }
  }
</nav>
