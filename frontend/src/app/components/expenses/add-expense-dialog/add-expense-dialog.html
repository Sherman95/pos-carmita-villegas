<div class="pro-dialog">

  <div class="dialog-header">
    <h3>Nueva Salida de Dinero</h3>
    <button mat-icon-button (click)="cancelar()" tabindex="-1">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="content-wrapper">

    <div class="amount-hero-wrapper">
      <span class="currency-symbol">$</span>
      <input
        type="number"
        [(ngModel)]="data.monto"
        class="ghost-input"
        placeholder="0.00"
        autoFocus>
    </div>
    <p class="helper-text">Ingrese el monto a retirar</p>

    <div class="section-label">Método de Pago</div>
    <mat-button-toggle-group [(ngModel)]="data.metodo_pago" class="pro-toggles">
      <mat-button-toggle value="EFECTIVO" class="toggle-btn">
        <mat-icon>payments</mat-icon> Caja Física
      </mat-button-toggle>
      <mat-button-toggle value="TRANSFERENCIA" class="toggle-btn">
        <mat-icon>account_balance</mat-icon> Banco
      </mat-button-toggle>
    </mat-button-toggle-group>

    <div class="inputs-grid">

      <div class="category-field-wrapper">
        <mat-form-field appearance="outline" class="pro-field">
          <mat-label>Categoría</mat-label>
          <mat-select [(ngModel)]="data.categoria">
            @for (cat of categories; track cat.id) {
              <mat-option [value]="cat.codigo">
                <mat-icon [style.color]="cat.color">{{ cat.icono }}</mat-icon> {{ cat.nombre }}
              </mat-option>
            }
          </mat-select>
          <mat-icon matPrefix>category</mat-icon>
        </mat-form-field>
        <button type="button" mat-button class="btn-manage-cats-inline" (click)="openManageCategories()">
          <mat-icon>add_circle_outline</mat-icon> Gestionar / Nueva Categoría
        </button>
      </div>

      <mat-form-field appearance="outline" class="pro-field">
        <mat-label>Nota / Descripción</mat-label>
        <input matInput [(ngModel)]="data.descripcion" placeholder="Ej: Pago de luz...">
      </mat-form-field>

    </div>

  </mat-dialog-content>

  <div class="dialog-footer">
    <button mat-flat-button class="submit-btn" (click)="guardar()"
            [disabled]="!data.monto || !data.descripcion || data.monto <= 0">
      REGISTRAR GASTO
    </button>
  </div>

</div>
